name: Performance Recovery A/B

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Select the comparison or the synthetic request-log GC recovery test
        required: true
        type: choice
        options:
          - comparison
          - request-log-gc
        default: comparison
      confirm:
        description: Type yes to start the selected GitHub-hosted synthetic suite
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: no
      baseline_ref:
        description: Baseline Git revision to compare against
        required: true
        type: string
        default: 1d6d93cbf4de6e673d75811fadd21f45b9a40482
      candidate_ref:
        description: Candidate Git revision; blank uses the dispatched ref
        required: false
        type: string
        default: ""
      duration_secs:
        description: Measured duration per variant; production proof requires at least 600
        required: true
        type: string
        default: "600"
      run_id:
        description: Optional safe run identifier for the isolated GitHub-hosted workspace
        required: false
        type: string
        default: ""

permissions:
  contents: read

# The comparison owns generated fixture databases and an isolated Docker run. Never run two
# copies concurrently on the same GitHub-hosted runner.
concurrency:
  group: performance-recovery-manual
  cancel-in-progress: false

jobs:
  performance-recovery:
    if: ${{ inputs.suite == 'comparison' }}
    name: Performance Recovery Comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Prepare local evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/performance-recovery"

      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate dispatch and candidate identity
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
          DURATION_SECS: ${{ inputs.duration_secs }}
        run: |
          set -euo pipefail
          if [[ "${CONFIRM}" != "yes" ]]; then
            echo "Refusing to start: dispatch the workflow with confirm=yes." >&2
            exit 2
          fi
          if ! [[ "${DURATION_SECS}" =~ ^[0-9]+$ ]] ||
            (( DURATION_SECS < 600 || DURATION_SECS > 1800 )); then
            echo "duration_secs must be an integer between 600 and 1800." >&2
            exit 2
          fi
          baseline_sha="$(git rev-parse --verify "${BASELINE_REF}^{commit}")"
          candidate_sha="$(git rev-parse HEAD)"
          if [[ "${baseline_sha}" == "${candidate_sha}" ]]; then
            echo "baseline_ref and candidate_ref must resolve to different commits." >&2
            exit 2
          fi
          {
            echo "candidate_sha=${candidate_sha}"
            echo "baseline_sha=${baseline_sha}"
            echo "duration_secs=${DURATION_SECS}"
          } | tee "${RUNNER_TEMP}/performance-recovery/identity.txt"

      - name: Install local fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y sqlite3 zstd

      - name: Run GitHub-hosted fixture comparison
        shell: bash
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
          DURATION_SECS: ${{ inputs.duration_secs }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          scripts/run-performance-recovery-github-hosted.sh 2>&1 \
            | tee "${RUNNER_TEMP}/performance-recovery/comparison.log"

      - name: Upload sanitized comparison evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: performance-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-recovery
          if-no-files-found: warn
          retention-days: 14

      - name: Write comparison handoff
        if: ${{ always() }}
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Performance Recovery A/B"
            echo ""
            echo "- Job status: ${JOB_STATUS}"
            echo "- Run: ${RUN_URL}"
            echo "- Execution target: GitHub-hosted ubuntu-24.04."
            echo "- Databases are generated local fixtures; no production snapshot or private network host is used."
            echo "- Sanitized logs and comparison output are in the uploaded artifact."
          } >> "${GITHUB_STEP_SUMMARY}"

  request-log-gc-recovery:
    if: ${{ inputs.suite == 'request-log-gc' }}
    name: Request Log GC Recovery Load
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Prepare private evidence directory
        shell: bash
        run: mkdir -p "${RUNNER_TEMP}/gc-recovery"

      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require explicit manual confirmation
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM" != "yes" ]]; then
            echo "Refusing to start: dispatch the workflow with confirm=yes." >&2
            exit 2
          fi

      - name: Verify GC workflow and harness contracts
        run: python3 -m unittest discover -s tests/performance_recovery -p 'test_github_workflow.py'

      - name: Record candidate identity
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          printf 'candidate_sha=%s\n' "${candidate_sha}" >> "${GITHUB_OUTPUT}"
          printf '{"candidate_sha":"%s","suite":"request-log-gc","run_id":"%s"}\n' \
            "${candidate_sha}" "${GITHUB_RUN_ID}" \
            > "${RUNNER_TEMP}/gc-recovery-identity.json"

      - name: Install SQLite build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libsqlite3-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0

      - name: Cache Rust build inputs
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/ci-test
          key: ${{ runner.os }}-gc-recovery-rust-1.91.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs', 'rust-toolchain.toml', '.cargo/**', 'src/**') }}
          restore-keys: |
            ${{ runner.os }}-gc-recovery-rust-1.91.0-

      - name: Build service binary
        run: cargo build --locked --all-features --profile ci-test --bin tavily-hikari

      - name: Test maintenance ticket survival across pressure backoff
        run: cargo test --locked --all-features --profile ci-test --lib maintenance_bulk_ticket_survives_scheduled_pressure_backoff

      - name: Test productive GC continuation turn retention
        run: cargo test --locked --all-features --profile ci-test --lib maintenance_bulk_retains_request_logs_gc_progress_continuation

      - name: Test dashboard integrity admission retry policy
        run: cargo test --locked --all-features --profile ci-test --lib dashboard_integrity_admission_retry_keeps_transient_contention_short

      - name: Test GC transient pool pressure retry policy
        run: cargo test --locked --all-features --profile ci-test --lib request_logs_gc_retries_transient_pool_pressure_before_full_backoff

      - name: Test hot-page yield to GC-blocking re-audit
        run: cargo test --locked --all-features --profile ci-test --lib integrity_prioritizes_new_hot_page_then_gc_blocking_day

      - name: Test wide-range source mutation fencing
        run: cargo test --locked --all-features --profile ci-test --lib integrity_restarts_after_a_cancelled_existing_source_mutation

      - name: Test full GC-blocking day seal recovery
        run: cargo test --locked --all-features --profile ci-test --lib integrity_gc_recovers_missing_and_divergent_seals_without_touching_billing

      - name: Run two-phase synthetic recovery acceptance
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          python3 scripts/gc_recovery_load.py \
            --binary target/ci-test/tavily-hikari \
            --agent-dir "${RUNNER_TEMP}/gc-recovery" \
            --candidate-sha "${CANDIDATE_SHA}" \
            --baseline-seconds 60 \
            --high-seconds 1800 \
            --low-seconds 1800 \
            --low-rps 0.1

      - name: Upload JSON acceptance evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gc-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gc-recovery-identity.json
            ${{ runner.temp }}/gc-recovery/**/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Write GC recovery handoff
        if: ${{ always() }}
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Request Log GC Recovery Load"
            echo ""
            echo "- Job status: ${JOB_STATUS}"
            echo "- Run: ${RUN_URL}"
            echo "- Execution target: GitHub-hosted ubuntu-24.04."
            echo "- Fixture databases and service logs remain on the runner; only JSON acceptance evidence is uploaded."
          } >> "${GITHUB_STEP_SUMMARY}"
