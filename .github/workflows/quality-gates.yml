name: Quality Gates

on:
  pull_request:
    branches: [main, "prd/**"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gates-contract:
    name: Quality Gates Contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate quality gates contract
        run: python3 .github/scripts/check_quality_gates.py

      - name: Install observability validation dependencies
        run: python3 -m pip install --user PyYAML==6.0.2

      - name: Install pinned Prometheus tools
        env:
          PROMETHEUS_VERSION: 2.55.1
        run: |
          archive_dir="${RUNNER_TEMP}/prometheus-tools"
          mkdir -p "$archive_dir"
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            -o "$archive_dir/prometheus.tar.gz"
          printf '%s  %s\n' \
            '19700bdd42ec31ee162e4079ebda4cd0a44432df4daa637141bdbea4b1cd8927' \
            'prometheus.tar.gz' | (cd "$archive_dir" && sha256sum -c -)
          tar -xzf "$archive_dir/prometheus.tar.gz" -C "$archive_dir"
          sudo install -m 0755 "$archive_dir/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool

      - name: Validate observability provisioning
        env:
          OBSERVABILITY_REQUIRE_PROMTOOL: "true"
        run: bash scripts/test-observability-config.sh
