name: Notify failed release

on:
  workflow_run:
    workflows:
      - Release
      - CI Pipeline
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  resolve_release_context:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    outputs:
      ref_label: ${{ steps.resolve.outputs.ref_label }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      actor: ${{ steps.resolve.outputs.actor }}
      extra_details: ${{ steps.resolve.outputs.extra_details }}
      summary: ${{ steps.resolve.outputs.summary }}
      alert_suppressed: ${{ steps.resolve.outputs.alert_suppressed }}
      rerun_triggered: ${{ steps.resolve.outputs.rerun_triggered }}
    steps:
      - name: Checkout notifier sources
        uses: actions/checkout@v6

      - name: Resolve failed release metadata
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          TRIGGERING_ACTOR: ${{ github.event.workflow_run.triggering_actor.login || github.event.workflow_run.actor.login || github.actor }}
        shell: bash
        run: |
          python3 ./.github/scripts/release_failure_notifier.py

  notify_failure:
    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        needs.resolve_release_context.outputs.alert_suppressed != 'true'
      }}
    needs:
      - resolve_release_context
    permissions:
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@e48822f99c6402a753ed86557ea029754cbab20b
    with:
      outcome: ${{ github.event.workflow_run.conclusion }}
      summary: ${{ needs.resolve_release_context.outputs.summary }}

  smoke_test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@e48822f99c6402a753ed86557ea029754cbab20b
    with:
      outcome: failure
      summary: |-
        🧪 Smoke Test · ${{ github.repository }}
        project: ${{ github.repository }}
        status: smoke test
        result: failure
        smoke_title: 🧪 Smoke Test
        target_sha: ${{ github.sha }}
        run_url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        workflow: Notify failed release
        ref: ${{ format('branch: {0}', github.ref_name) }}
        attempt: ${{ github.run_attempt }}
        actor: ${{ github.actor }}
        event: workflow_dispatch
        note: manual notifier smoke test
