global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/hikari-recording-rules.yml

scrape_configs:
  - job_name: tavily-hikari
    metrics_path: /metrics
    scheme: http
    honor_labels: true
    bearer_token_file: /etc/prometheus/secrets/hikari-metrics.token
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/hikari/*.yml
        refresh_interval: 30s
